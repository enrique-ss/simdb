<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindred — Catalogador & Match Social de Mídias</title>
    <!-- Google Fonts Fidedignas ao Figma: Inter e Playfair Display (Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app-container">
        <!-- Container Dinâmico de Views -->
        <main id="view-container">
            <!-- Conteúdo injetado via JS -->
        </main>

        <!-- Rodapé de Navegação Fixo (100% idêntico ao Figma) -->
        <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-item active" data-view="home" title="Home">
                <span>🏠</span>
            </button>
            <button class="nav-item" data-view="search" title="Busca">
                <span>🔍</span>
            </button>
            <button class="nav-item" data-view="notifications" title="Notificações">
                <span>🔔</span>
            </button>

            <button class="nav-item" data-view="settings" title="Configurações">
                <span>🔧</span>
            </button>
            <button class="nav-item" data-view="profile" title="Perfil">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="nav-avatar-icon" alt="Perfil">
            </button>
        </nav>
    </div>

    <!-- Modal Universal -->
    <div id="global-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h3 id="modal-title" style="font-size: 1.1rem; font-weight: 700;">Detalhes</h3>
                <button id="close-modal-btn" style="background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
